name: Windows x86 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x86 build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: Becky-AI-Assistant-20-win32
          path: build/Release/Becky-AI-Assistant-20.dll
          if-no-files-found: error
          retention-days: 14
