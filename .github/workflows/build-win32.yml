name: Build Becky AI Assistant (Win32)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package plugin
        shell: pwsh
        run: |
          $dll = "build/Release/Becky-AI-Assistant-33.dll"
          if (!(Test-Path $dll)) {
            throw "Expected plugin DLL was not produced: $dll"
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $dll package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath Becky-AI-Assistant-33-win32.zip -Force

      - name: Upload Win32 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Becky-AI-Assistant-33-win32
          path: Becky-AI-Assistant-33-win32.zip
          if-no-files-found: error
          retention-days: 14
